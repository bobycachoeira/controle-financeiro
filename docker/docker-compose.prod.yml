# Produção: Caddy (TLS automático) + PocketBase + notifier.
# Uso:
#   CF_API_DOMAIN=api.seudominio.com docker compose -f docker/docker-compose.prod.yml up -d --build
# O front vai para a Vercel (apps/web). Este compose só roda o backend.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_API_DOMAIN: ${CF_API_DOMAIN:-api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocketbase

  pocketbase:
    build:
      context: ../apps/pocketbase
      dockerfile: ../../docker/Dockerfile.pocketbase
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      CF_ENCRYPTION_KEY: ${CF_ENCRYPTION_KEY:?defina CF_ENCRYPTION_KEY}
      CF_APP_URL: ${CF_APP_URL:?defina CF_APP_URL}
      CF_STEPUP_TTL: ${CF_STEPUP_TTL:-10m}
      CF_TIMEZONE: ${CF_TIMEZONE:-America/Sao_Paulo}
      CF_MAIL_HOST: ${CF_MAIL_HOST:-}
      CF_MAIL_PORT: ${CF_MAIL_PORT:-587}
      CF_MAIL_USER: ${CF_MAIL_USER:-}
      CF_MAIL_PASSWORD: ${CF_MAIL_PASSWORD:-}
      CF_MAIL_FROM: ${CF_MAIL_FROM:-no-reply@controle-financeiro.local}
      CF_VAPID_PUBLIC_KEY: ${CF_VAPID_PUBLIC_KEY:-}
    volumes:
      - pb_data:/pb/pb_data

  notifier:
    build:
      context: ..
      dockerfile: apps/notifier/Dockerfile
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      CF_POCKETBASE_URL: http://pocketbase:8090
      CF_POCKETBASE_ADMIN_EMAIL: ${CF_POCKETBASE_ADMIN_EMAIL:-}
      CF_POCKETBASE_ADMIN_PASSWORD: ${CF_POCKETBASE_ADMIN_PASSWORD:-}
      CF_VAPID_PUBLIC_KEY: ${CF_VAPID_PUBLIC_KEY:-}
      CF_VAPID_PRIVATE_KEY: ${CF_VAPID_PRIVATE_KEY:-}
      CF_VAPID_SUBJECT: ${CF_VAPID_SUBJECT:-mailto:admin@controle-financeiro.local}
      CF_NOTIFIER_CRON: ${CF_NOTIFIER_CRON:-0 * * * *}
      CF_TIMEZONE: ${CF_TIMEZONE:-America/Sao_Paulo}

volumes:
  pb_data:
  caddy_data:
  caddy_config:
