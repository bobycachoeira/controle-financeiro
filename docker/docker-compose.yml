name: controle-financeiro

services:
  pocketbase:
    build:
      context: ../apps/pocketbase
      dockerfile: ../../docker/Dockerfile.pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      CF_ENCRYPTION_KEY: ${CF_ENCRYPTION_KEY:-dev-insecure-encryption-key-change-me}
      CF_MAIL_HOST: ${CF_MAIL_HOST:-}
      CF_MAIL_FROM: ${CF_MAIL_FROM:-no-reply@controle-financeiro.local}
      CF_CORS_ORIGINS: ${CF_CORS_ORIGINS:-http://localhost:5173}
      CF_STEPUP_TTL: ${CF_STEPUP_TTL:-10m}
      CF_APP_URL: ${CF_APP_URL:-http://localhost:5173}
    volumes:
      - pb_data:/pb/pb_data

  notifier:
    build:
      context: ..
      dockerfile: apps/notifier/Dockerfile
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      CF_POCKETBASE_URL: http://pocketbase:8090
      CF_POCKETBASE_ADMIN_EMAIL: ${CF_POCKETBASE_ADMIN_EMAIL:-admin@example.com}
      CF_POCKETBASE_ADMIN_PASSWORD: ${CF_POCKETBASE_ADMIN_PASSWORD:-change-me}
      CF_VAPID_PUBLIC_KEY: ${CF_VAPID_PUBLIC_KEY:-}
      CF_VAPID_PRIVATE_KEY: ${CF_VAPID_PRIVATE_KEY:-}
      CF_VAPID_SUBJECT: ${CF_VAPID_SUBJECT:-mailto:admin@controle-financeiro.local}
      CF_NOTIFIER_CRON: ${CF_NOTIFIER_CRON:-0 * * * *}
      CF_TIMEZONE: ${CF_TIMEZONE:-America/Sao_Paulo}

volumes:
  pb_data:
