name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate PocketBase hooks bundle
        run: pnpm build:hooks

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Shared tests
        run: pnpm test:shared

      - name: Web tests
        run: pnpm test:web

      - name: Download PocketBase
        run: |
          curl -sL -o /tmp/pb.zip https://github.com/pocketbase/pocketbase/releases/download/v0.23.7/pocketbase_0.23.7_linux_amd64.zip
          unzip -o /tmp/pb.zip -d apps/pocketbase
          chmod +x apps/pocketbase/pocketbase

      - name: PocketBase integration tests
        run: pnpm test:pb
